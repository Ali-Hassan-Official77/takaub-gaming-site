<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">TAKAGHUB Gaming Logo</title>
  <desc id="desc">TAKAGHUB premium gaming logo matching the site's black, white and neon-lime visual identity.</desc>
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7FF5A"/>
      <stop offset="0.5" stop-color="#B7FF2A"/>
      <stop offset="1" stop-color="#8FE000"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#E9F7C8"/>
      <stop offset="1" stop-color="#B7FF2A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background; site colors: #090C11 / #B7FF2A / white -->

  <!-- Premium gaming icon -->
  <g transform="translate(22 28)">
    <!-- angular crown / T mark -->
    <path d="M45 66 L116 18 L187 66 L164 82 L116 58 L68 82 Z"
          fill="url(#lime)" filter="url(#glow)"/>
    <path d="M69 82 H163 V108 H69 Z" fill="#090C11"/>
    <path d="M116 67 V265 L76 222 V108 H156 V222 Z"
          fill="url(#lime)"/>

    <!-- controller -->
    <path d="M39 157
             C50 126 82 125 108 148
             C114 154 122 154 128 148
             C154 125 186 126 197 157
             L212 210
             C219 235 191 252 174 234
             L149 208
             C141 200 133 197 116 197
             C99 197 91 200 83 208
             L58 234
             C41 252 13 235 20 210 Z"
          fill="#090C11" stroke="url(#lime)" stroke-width="8" filter="url(#glow)"/>

    <!-- D-pad -->
    <g fill="#B7FF2A">
      <rect x="67" y="159" width="18" height="58" rx="4"/>
      <rect x="47" y="179" width="58" height="18" rx="4"/>
    </g>

    <!-- action buttons -->
    <g fill="#B7FF2A">
      <circle cx="159" cy="173" r="10"/>
      <circle cx="183" cy="193" r="10"/>
      <circle cx="159" cy="213" r="10"/>
      <circle cx="135" cy="193" r="10"/>
    </g>

    <!-- motion arcs -->
    <path d="M34 147 C14 123 17 96 38 76"
          fill="none" stroke="#B7FF2A" stroke-width="7" stroke-linecap="round"/>
    <path d="M198 76 C219 96 222 123 202 147"
          fill="none" stroke="#B7FF2A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(300 0)"
     font-family="Arial, Helvetica, sans-serif"
     font-style="italic"
     font-weight="900"
     letter-spacing="-5">
    <text x="0" y="204" font-size="142" fill="url(#word)">TAKAGHUB</text>
    <path d="M4 228 H735" stroke="#B7FF2A" stroke-width="5" stroke-linecap="round"/>
    <text x="5" y="256" font-family="Arial, Helvetica, sans-serif"
          font-style="normal" font-weight="700" font-size="16"
          letter-spacing="7" fill="#8F969E">GAME DISCOVERY</text>
  </g>
</svg>